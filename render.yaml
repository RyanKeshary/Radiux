services:
  - type: web
    name: radiux-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node server/websocket.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        # Set this in Render dashboard: https://your-frontend.vercel.app
        sync: false
      - key: SUPABASE_URL
        # Set this in Render dashboard: https://your-project.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        # Set this in Render dashboard: your Supabase service role key
        sync: false
