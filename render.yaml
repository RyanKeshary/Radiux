services:
  - type: web
    name: radiux-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node server/websocket.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
